version: '3'
services:
  app:
    container_name: short-url
    image: doog/short-url:latest
    restart: on-failure
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3000/_heartbeat | grep -qx ok" ] # alpine 无 curl，用 busybox wget
      interval: 10s # 设置检查间隔
      timeout: 10s # 设置检查超时时间
      retries: 3 # 设置重试次数
#      start_period: 30s # 启动后，多少秒开始启动检测程序
    ports:
      - 127.0.0.1:5050:3000
    environment:
      APP_PREFIX: http://example.com/
      APP_TOKEN: YOUR_TOKEN
    volumes:
      - /data/short-url-store:/usr/src/app/short-url-store